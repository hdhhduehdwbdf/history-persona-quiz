<head>
<meta charset="UTF-8">

</head>
<body>
<div class="phone">
  <div class="fade-in" style="padding:56px 24px 24px;text-align:center;">
    <div class="seal" style="width:64px;height:64px;font-size:26px;margin:0 auto 18px;">选</div>
    <h1 style="margin:0 0 8px;font-size:22px;">你想和谁对话？</h1>
    <p class="tiny" style="margin:0;">选择候选人物范围，题目与计分方式完全一致</p>
  </div>

  <div class="fade-in" style="padding:8px 20px;">
    <div class="card" style="padding:20px 18px;margin-bottom:12px;cursor:pointer;" onclick="choose('女')">
      <div style="display:flex;align-items:center;gap:14px;">
        <div style="width:48px;height:48px;border-radius:50%;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;font-size:22px;">♀</div>
        <div>
          <div style="font-size:17px;font-weight:600;">女性人物优先</div>
          <p class="tiny" style="margin:4px 0 0;">武则天 · 芈月 · 蔡文姬 · 虞姬 等</p>
        </div>
      </div>
    </div>
    <div class="card" style="padding:20px 18px;margin-bottom:12px;cursor:pointer;" onclick="choose('男')">
      <div style="display:flex;align-items:center;gap:14px;">
        <div style="width:48px;height:48px;border-radius:50%;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;font-size:22px;">♂</div>
        <div>
          <div style="font-size:17px;font-weight:600;">男性人物优先</div>
          <p class="tiny" style="margin:4px 0 0;">秦始皇 · 孔子 · 诸葛亮 · 拿破仑 等</p>
        </div>
      </div>
    </div>
    <div class="card" style="padding:20px 18px;margin-bottom:12px;cursor:pointer;" onclick="choose(null)">
      <div style="display:flex;align-items:center;gap:14px;">
        <div style="width:48px;height:48px;border-radius:50%;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;font-size:22px;">✦</div>
        <div>
          <div style="font-size:17px;font-weight:600;">不限性别</div>
          <p class="tiny" style="margin:4px 0 0;">全人物库，古今中外任你匹配</p>
        </div>
      </div>
    </div>
    <p class="tiny" style="text-align:center;margin-top:12px;">三种模式题目与计分完全相同，仅候选人物范围不同；切换将重置作答</p>
  </div>
</div>
<script src="../core.js"></script>
<script>
Store.load();
function choose(g) {
  Store.setGender(g);
  go('quiz.html');
}
</script>
</body>
</html>
