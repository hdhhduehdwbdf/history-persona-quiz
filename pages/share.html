<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>分享卡片</title>
<link rel="stylesheet" href="../css/common.css">
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#8a2f2b">
<meta name="description" content="3:4 / 1:1 / 9:16 三种比例的分享卡片，长按即可保存并分享给朋友。">
<meta property="og:type" content="website">
<meta property="og:site_name" content="历史人物测验">
<meta property="og:title" content="分享卡片 · 历史人物测验">
<meta property="og:description" content="3:4 / 1:1 / 9:16 三种比例的分享卡片，长按即可保存并分享给朋友。">
<meta property="og:image" content="https://history-persona-quiz.pages.dev/assets/og-cover.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://history-persona-quiz.pages.dev/pages/share.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="分享卡片 · 历史人物测验">
<meta name="twitter:description" content="3:4 / 1:1 / 9:16 三种比例的分享卡片，长按即可保存并分享给朋友。">
<meta name="twitter:image" content="https://history-persona-quiz.pages.dev/assets/og-cover.png">
<link rel="canonical" href="https://history-persona-quiz.pages.dev/pages/share.html">
<script src="../assets/pwa.js" defer></script>
<style>
  .seg { display: flex; background: var(--bg-deep); border-radius: 999px; padding: 3px; margin: 0 16px; }
  .seg button { flex: 1; border: none; background: transparent; padding: 9px 0; border-radius: 999px; font-size: 12.5px;
    color: var(--ink2); font-family: inherit; cursor: pointer; }
  .seg button.on { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(43,38,34,0.10); }
  .stage { margin: 14px 16px 0; padding: 14px; border-radius: var(--radius); background: var(--bg-deep); }
  .meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink3); margin-bottom: 8px; }
  .quote-line { font-size: 13px; color: var(--ink2); line-height: 1.7; }
  .ready { display: inline-block; font-size: 11px; color: var(--green); background: #EAF3DE; border-radius: 999px; padding: 2px 8px; }
  .hook { display: flex; gap: 8px; overflow-x: auto; margin: 12px 16px 0; padding-bottom: 4px; }
  .hook span { flex: 0 0 auto; font-size: 12px; color: var(--ink2); background: var(--bg-deep); border-radius: 999px; padding: 6px 12px; }
</style>
</head>
<body>
<div class="phone">
  <div style="padding:18px 16px 14px;display:flex;align-items:center;gap:10px;border-bottom:0.5px solid var(--line);">
    <span class="btn-ghost" onclick="go('report.html')">←</span>
    <h3 style="font-size:16px;">分享卡片</h3>
    <span style="margin-left:auto;" class="ready" id="ready-tag">已生成</span>
  </div>

  <div class="seg" style="margin-top:14px;">
    <button id="tab-34" class="on" onclick="setRatio('3:4')">小红书 3:4</button>
    <button id="tab-11" onclick="setRatio('1:1')">朋友圈 1:1</button>
    <button id="tab-916" onclick="setRatio('9:16')">封面 9:16</button>
  </div>

  <div class="stage">
    <div class="meta"><span id="meta-size">750 × 1000</span><span>PNG · 含二维码 · 可直接保存</span></div>
    <canvas id="share-card"></canvas>
  </div>

  <div style="display:flex;gap:10px;margin:14px 16px 0;">
    <button class="btn-primary" style="flex:1.4;margin:0;" onclick="saveCard()">保存图片</button>
    <button class="btn-ghost" style="flex:1;padding:12px 0;text-align:center;" onclick="copyText()">复制文案</button>
  </div>

  <div class="hook" id="hook-row"></div>

  <div class="card copy-card" style="margin-top:10px;">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <p class="section-title" style="margin:0 0 8px -2px;">分享文案</p>
      <span class="btn-ghost" style="padding:4px 12px;font-size:12px;" onclick="nextCopy()">换一换</span>
    </div>
    <p class="quote-line" id="share-copy"></p>
    <div class="divider"></div>
    <p class="tiny">卡片右下角二维码指向本站，别人扫码就能直接测；配一句"你猜我像谁？"发出去，互动会更好。</p>
  </div>

  <div class="bottom-bar">
    <button class="btn-primary" onclick="go('report.html')">返回我的报告</button>
    <p class="tiny" style="text-align:center;margin-top:6px;">卡片由前端 Canvas 本地绘制，图片不上传任何服务器</p>
  </div>
</div>

<script src="../core.js"></script>
<script>
ensureAnswers();
const fig = Store.getFigure(Store.data.matchId) || Store.pool()[0];
const pct = Store.data.matchPct || 88;
const scores = Store.data.scores || Store.calcScores();
const sorted = Store.topDims();
const strong = sorted[0], weak = sorted[7];
let ratio = '3:4';
let copyIdx = 0;

const COPIES = [
  '我测出来是' + fig.name + '，相似度 ' + pct + '%。' + strong + '最满、' + weak + '垫底，这俩我自己也认。',
  '本来当个乐子，结果说我像' + fig.name + '。那句"' + fig.quote + '"，我收下了。',
  '我的结果：' + fig.name + '，' + fig.tags.join('、') + '。盲点那条说的是"' + fig.blind_spot.slice(0, 22) + '"，想了想，确实是。',
  '24 道题测出来最像' + fig.name + '。拿给朋友看，她说"这确实是你"，那就算它准了。',
  '相似度 ' + pct + '%，最像' + fig.name + '。' + weak + '这项我不服，但建议这条我确实该听。',
  '报告里有一句写我："' + fig.summary3[1] + '" 被一句话说中的感觉，挺奇妙。',
  '我的历史人格是' + fig.name + '。开场白那句"' + fig.opener.slice(0, 24) + '"，看笑了。',
  '测了个历史人物人格，我是' + fig.name + '型。顺手把身边人猜了一圈，猜对好几个。',
  '结果：' + fig.name + '，相似度 ' + pct + '%。卡片右下角有二维码，想知道自己像谁就扫一下。'
];

function render() {
  drawShareCard(document.getElementById('share-card'), fig, pct, scores, ratio);
  document.getElementById('meta-size').textContent =
    ratio === '3:4' ? '750 × 1000' : (ratio === '1:1' ? '750 × 750' : '750 × 1334');
  document.getElementById('tab-34').className = ratio === '3:4' ? 'on' : '';
  document.getElementById('tab-11').className = ratio === '1:1' ? 'on' : '';
  document.getElementById('tab-916').className = ratio === '9:16' ? 'on' : '';
  document.getElementById('share-copy').textContent = COPIES[copyIdx % COPIES.length];
}
function setRatio(r) {
  ratio = r;
  render();
  Toast.show('已切换：' + (r === '3:4' ? '小红书 3:4 竖图' : r === '1:1' ? '朋友圈 1:1 方图' : '视频 / 状态 9:16 长图'));
}
function nextCopy() {
  copyIdx++;
  document.getElementById('share-copy').textContent = COPIES[copyIdx % COPIES.length];
  Toast.show('已换文案（第 ' + ((copyIdx % COPIES.length) + 1) + ' / ' + COPIES.length + ' 版）');
}
function saveCard() {
  Store.data.stats.shared = (Store.data.stats.shared || 0) + 1;
  Store.save();
  const canvas = document.getElementById('share-card');
  try {
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = '我最像' + fig.name + '_' + ratio.replace(':', '-') + '.png';
    a.click();
    Toast.show('已保存：我最像' + fig.name + '（' + ratio + '）.png');
  } catch (e) {
    Toast.show('当前浏览器不支持直接下载，可长按图片保存');
  }
}
function copyText() {
  const txt = document.getElementById('share-copy').textContent;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(txt).then(() => Toast.show('文案已复制'))
      .catch(() => Toast.show('复制失败，请手动长按选择'));
  } else {
    Toast.show('复制失败，请手动长按选择文案');
  }
}
function buildHooks() {
  const hints = ['称号：当代·' + fig.tags[0] + '型', '最强维：' + strong, '最弱维：' + weak, '专属主色卡片', '含二维码回流'];
  document.getElementById('hook-row').innerHTML = hints.map(h => '<span>' + h + '</span>').join('');
}
buildHooks();
render();
QR_IMG.onload = render;
</script>
</body>
</html>
